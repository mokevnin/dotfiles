name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only: the check lints and publishes nothing, so the token needs nothing
# else. Only automerge below asks for write, and only on its own job.
permissions:
  contents: read

# A new push cancels the older runs of the same pull request (or of main) only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # full history: gitleaks in the lint task scans every commit, and the
      # default shallow checkout would hand it exactly one
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # nothing later pushes, so the token does not need to stay in .git/config
          persist-credentials: false

      # installs mise, installs the linters only, and caches — all the action's own work
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: jactionlint stylua taplo typos gitleaks

      # [dotfiles] points at ~/dotfiles/home, the clone's place on a real machine,
      # while the runner checks out into its workspace — link it to where mise looks
      - name: Link checkout to ~/dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/dotfiles"

      # the runner already has its own ~/.gitconfig, and without --force-dotfiles
      # the plan fails with "refusing to overwrite existing files". This is still
      # a --dry-run, nothing gets written.
      - name: Bootstrap plan
        run: mise bootstrap --dry-run --force-dotfiles

      # what gets linted is described by a task in mise.toml so that the same thing
      # runs locally and here. Task tool auto-install is off: mise-action has
      # already installed jactionlint and stylua, otherwise the task would pull in
      # every tool from [tools]
      - name: Lint
        run: mise run lint
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # Dependabot PRs merge themselves once the check above is green. main has no
  # required checks, so `--auto` would not wait for anything — `needs` is the gate.
  # A merge made with GITHUB_TOKEN does not start a push run on main; the PR run
  # has already checked the same tree.
  automerge:
    needs: check
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --repo instead of a checkout; it also keeps gh from touching local branches
      - name: Merge
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
