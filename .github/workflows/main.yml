name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # ставит mise, ставит только линтеры и кэширует — всё это работа самого action
      - uses: jdx/mise-action@v4
        with:
          install_args: actionlint stylua

      # на раннере уже есть свой ~/.gitconfig, и без --force-dotfiles план падает
      # на "refusing to overwrite existing files". Это всё равно --dry-run,
      # ничего не пишется.
      - name: Bootstrap plan
        run: mise bootstrap --dry-run --force-dotfiles

      # что именно линтуется — описано таском в mise.toml, чтобы локально и здесь
      # гонялось одно и то же. Автоустановку тулов для таска гасим: mise-action
      # уже поставил actionlint и stylua, иначе таск потянет все тулы из [tools]
      - name: Lint
        run: mise run lint
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
