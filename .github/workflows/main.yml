name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # ставит mise, ставит только actionlint и кэширует — всё это работа самого action
      - uses: jdx/mise-action@v4
        with:
          install_args: actionlint

      - name: Bootstrap plan
        run: mise bootstrap --dry-run

      - name: Lint
        run: actionlint
