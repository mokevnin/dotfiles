# The only config of the machine, macOS only. Lives in home/ at the path it has
# under $HOME; `mise bootstrap --config-dir` links ~/.config/mise to this
# directory, so the tools and the bootstrap description are available globally.
# mise.toml at the repo root is a symlink back here, for CI: there the repo is
# a plain project and mise finds its config through that file.
#
# Fresh machine:   mise bootstrap --from https://github.com/mokevnin/dotfiles.git --from-dir ~/dotfiles --config-dir home/.config/mise --yes
# (over https — there are no ssh keys on a new machine yet; run bootstrap from ~/dotfiles)
# Already cloned:  mise bootstrap --yes

[settings]
idiomatic_version_file_enable_tools = []
# A toolset this size on "latest" means dozens of requests to api.github.com,
# where the anonymous limit is 60 per hour — hence the 429s on upgrade. The token
# comes from gh and is not kept in the repo; if gh is not authenticated yet
# (fresh machine), mise just warns and goes on anonymously.
# gh itself is installed by mise and only its shim is on PATH, so the shim calls
# mise, which calls this command again — a fork bomb (~3300 processes once).
# The guard variable makes the nested call return empty instead of recursing.
github.credential_command = '[ -n "$MISE_GH_TOKEN_LOOKUP" ] || MISE_GH_TOKEN_LOOKUP=1 gh auth token'
# Everything here rides "latest", so a tool arrives the moment it is published —
# including a release made from a stolen npm or GitHub token. A day of cooling is
# what usually separates such a release from being yanked. Locked versions and
# exact pins are exempt, and backends without release dates are unaffected.
minimum_release_age = "24h"
# claude-code and codex are the exception: they ship several builds a day and a
# fix for yesterday's build is itself a release, so a day of waiting means
# running a known-worse version. The exclude is matched by the [tools] name.
# http:yc is excluded for another reason: its version list is a bare number with
# no dates, and since every backend gets the cooldown mise warns about it on
# each install and upgrade.
minimum_release_age_excludes = ["claude-code", "codex", "http:yc"]
# The aqua registry is baked in when mise itself is built, so a packaging fix
# lands only with the next mise release — difftastic 0.71.0 renamed its assets
# and every install failed until then. Fetching the registry instead costs one
# request per unresolved tool and keeps upstream fixes arriving on their own.
aqua.baked_registry = false
dotfiles.root = "~/dotfiles/home"
dotfiles.default_mode = "symlink"
# For `mise daemons`: projects are moving their dev services off
# process-compose onto [daemons], which is still experimental.
experimental = true

[settings.ruby]
compile = false

[tools]
# languages / runtimes
go = "latest"
java = "temurin-25"
node = "26.8.2"
python = "latest"
ruby = "latest"

pnpm = "latest"

# cli
jactionlint = "latest"
air = "latest"
ansible = "latest"
# pipx: and pypi: are the same backend and both install through uv; the old
# spelling stays because ansible-lint warns about a "broken local setup" on
# every run unless the path it runs from contains "pipx".
"pipx:ansible-lint" = "latest"
ast-grep = "latest"
bat = "latest"
bottom = "latest"              # btm, replaces htop
# auto_update lets mise refresh these in the background (checked every 24h by
# default, tool_update.check_duration): they ship several builds a day, and
# waiting for the next manual `mise run upgrade` means running a stale one.
claude-code = { version = "latest", auto_update = true }
codex = { version = "latest", auto_update = true }
copilot-cli = "latest"
delta = "latest"
devcontainer-cli = "latest"    # the `devcontainer` binary devcontainers.nvim drives
difftastic = "latest"          # structural diff, understands syntax
docker-cli = "latest"
docker-compose = "latest"
duf = "latest"                 # replaces df
dust = "latest"                # replaces du
eza = "latest"                 # replaces ls
fd = "latest"
fzf = "latest"                 # ctrl-r history search, ctrl-t file picker, alt-c cd
gdu = "latest"                 # replaces ncdu
gh = "latest"
gitleaks = "latest"            # secret scan, this repo is public
glab = "latest"
glow = "latest"                # markdown in the terminal
# Projects pin their own versions of these two; the global entry is what lets
# `mise run clean` call them from outside any project to clear their caches.
golangci-lint = "latest"
hyperfine = "latest"           # command benchmarks
helm = "latest"
jq = "latest"
just = "latest"
k9s = "latest"
kubectl = "latest"
kubectx = "latest"
lazydocker = "latest"
lazygit = "latest"
mago = "latest"                 # php linter, formatter and analyzer; needs no php of its own
markdownlint-cli2 = "latest"
neovim = "latest"
opencode = "latest"
overmind = "latest"
# The supervisor behind `mise daemons`: mise only generates its config and does
# not install it, and several [daemons] features need a recent release.
pitchfork = "latest"
pandoc = "latest"
ripgrep = "latest"
sd = "latest"                   # replaces gnu-sed
starship = "latest"             # prompt, configured by starship.toml
shellcheck = "latest"
stern = "latest"
stylua = "latest"               # lua formatter, also checks the nvim config in CI
taplo = "latest"                # lints the toml, see .mise.toml
tealdeer = "latest"             # provides tldr
terraform = "latest"
tokei = "latest"                # code statistics, replaces scc
# nvim-treesitter shells out to this to compile a parser that has no prebuilt
# artifact. The brew formula is tree-sitter-cli; in the registry it is the
# aqua package under the plain name.
tree-sitter = "latest"
trivy = "latest"                # see golangci-lint above
typos = "latest"                # spelling, the repo is english-only
# The installer behind the pypi: backend (ansible, ansible-lint). mise uses it
# only when it resolves as a tool of its own — an undeclared uv is a shim with
# no version, and `expose` in the ansible registry entry refuses to go on.
uv = "latest"
watchexec = "latest"            # runs a command on file changes
xh = "latest"                   # replaces httpie
yq = "latest"
zoxide = "latest"               # smart cd
# Generates the shell completions for everything above. Almost none of these
# tools ship a completion file — each prints one from a subcommand, with a
# different flag per tool — and this carries the table of those flags so that
# this repo does not have to. See "The shell" in the README.
"github:alltuner/mise-completions-sync" = "latest"
# The yandex-cloud-cli cask works, but it only wraps the vendor install.sh: the
# plain binary cannot be a `binary` artifact, because it is ad-hoc signed and a
# quarantined copy is killed by Gatekeeper, and its `uninstall delete:` asks for
# a sudo password. The vendor ships plain versioned binaries, so yc is declared
# as an http: tool instead of being curl|bash-ed from a hook. release/stable
# holds the current version number and nothing else, which is the plain-text
# format version_list_url reads — so this resolves "latest" and `mise upgrade`
# picks new releases up on its own.
"http:yc" = { version = "latest", url = "https://storage.yandexcloud.net/yandexcloud-yc/release/{{version}}/darwin/arm64/yc", bin = "yc", version_list_url = "https://storage.yandexcloud.net/yandexcloud-yc/release/stable" }

# nvim provider hosts, have to live inside the active node/ruby
"npm:neovim" = "latest"
"npm:markdown-toc" = "latest"
"gem:neovim" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
"npm:sentry" = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }

# Completions are generated, not tracked. postinstall covers the day-to-day —
# it runs once per `mise install`/`upgrade` batch, not once per tool, and
# --new-only limits the work to what actually changed. On a fresh machine
# misecompsync is installed by [tools] above, so post-tools is the first moment
# it exists: that run is the full one, and it is also where mise's own _mise
# comes from. `|| true` because --install refuses to replace a file it did not
# write, and a completion file is not worth failing a bootstrap over.
[hooks]
postinstall = "misecompsync --shell zsh --new-only"

[bootstrap.hooks.post-tools]
description = "Generate zsh completions for mise and the tools"
run = "mise completion zsh --install || true; misecompsync --shell zsh"

# mise cannot install Homebrew itself, and it installs brew:/brew-cask: through
# brew — so brew has to show up before the packages. NONINTERACTIVE=1 keeps the
# installer from waiting on Enter under --yes; it still asks for a sudo password.
[bootstrap.hooks.pre-packages]
description = "Install Homebrew unless it is already there"
run = 'command -v brew >/dev/null 2>&1 || [ -x /opt/homebrew/bin/brew ] || [ -x /usr/local/bin/brew ] || NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

# Several GUI apps (Slack, Telegram, WhatsApp, Zoom, NordVPN) were installed by
# hand and sit in /Applications without a brew receipt. adopt takes such an
# existing bundle under management instead of installing over it.
[bootstrap.brew]
adopt = true
# Write Homebrew's cask metadata for casks that mise installs, so brew outdated,
# brew upgrade and brew doctor recognise them (needs mise 2026.10.20+).
homebrew_metadata = true

# System packages. brew:/brew-cask: are installed by mise, but through Homebrew itself.
[bootstrap.packages]
# mise's own build has self-update disabled ("update mise the same way you
# installed it"), and that way is brew — so brew is what moves it.
"brew:mise" = "latest"
"brew:wget" = "latest"
"brew:sox" = "latest"
"brew:tmux" = "latest"                    # overmind runs the Procfile in a tmux session and does not pull it in
"brew:git-lfs" = "latest"                 # the lfs filter is set up in .gitconfig
"brew-cask:ghostty" = "latest"
"brew-cask:docker-desktop" = "latest"     # docker-cli is useless without a daemon
"brew-cask:1password" = "latest"          # op-ssh-sign signs the commits
"brew-cask:google-chrome" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:telegram" = "latest"
"brew-cask:whatsapp" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:obs" = "latest"
"brew-cask:audacity" = "latest"
# pkg casks: brew installs them through installer(8), so they ask for a password
"brew-cask:zoom" = "latest"
"brew-cask:nordvpn" = "latest"
"brew-cask:session-manager-plugin" = "latest"  # the aws-cli needs it for `aws ssm start-session`
"brew-cask:gcloud-cli" = "latest"

# Only the plugin files are used — git, vi-mode and eza are sourced directly by
# rc.zsh. The framework around them (themes, plugins=(), the updater) is not
# loaded, so this is a plain clone rather than the installer script. Tracking
# master is deliberate: the aliases come from upstream and updating them is the
# point.
[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", ref = "master", depth = 1 }

[dotfiles]
"~/.config/nvim" = "~/dotfiles/home/.config/nvim"
"~/.gitconfig" = "~/dotfiles/home/.gitconfig"
"~/.config/starship.toml" = "~/dotfiles/home/.config/starship.toml"
# The whole shell config, ordering included, is one tracked file. ~/.zshrc is
# reduced to the single line that sources it — mise creates the file if it does
# not exist, so nothing else has to put a .zshrc on a fresh machine. `mise
# activate` lives in rc.zsh too, which is why there is no
# [bootstrap.mise_shell_activate] block.
"~/.config/zsh/rc.zsh" = "~/dotfiles/home/.config/zsh/rc.zsh"
"~/.zshrc/rc" = { line = 'source ~/.config/zsh/rc.zsh' }
# The four tools misecompsync's built-in registry does not cover. Not an XDG
# path: the override is read through the dirs crate, which on macOS means
# ~/Library/Application Support rather than the ~/.local/share the README names.
"~/Library/Application Support/mise-completions-sync/registry.toml" = "~/dotfiles/home/Library/Application Support/mise-completions-sync/registry.toml"

# The background half of auto_update on claude-code and codex above: a
# LaunchAgent checks them hourly, so a launch never waits for a download.
[bootstrap.services.mise-tool-update]
builtin = "tool-update"

[bootstrap.user]
login_shell = "zsh"

# The machine's own settings — the one part of it this repo did not describe.
# Only what was actually changed here by hand is declared: the point is to
# reproduce this machine, not to impose a taste, so everything still at the macOS
# default is left undeclared. mise never writes these on its own — `mise
# bootstrap`, or `mise bootstrap macos defaults apply`, does, and `mise bootstrap
# macos defaults status` shows what differs. Apply restarts neither Dock nor
# Finder; `killall Dock` picks the Dock ones up.
[bootstrap.macos.dock]
orientation = "left"                # vertical space is the scarce one on a laptop
autohide = true

[bootstrap.macos.keyboard]
automatic_capitalization = false     # the two the friendly section covers
automatic_spelling_correction = false

# The rest of the same decision — macOS does not get to rewrite what was typed.
# No friendly keys exist for these four, so they go in as raw NSGlobalDomain.
[bootstrap.macos.defaults.NSGlobalDomain]
NSAutomaticQuoteSubstitutionEnabled = false   # "" stay straight, which is what code needs
NSAutomaticDashSubstitutionEnabled = false    # -- stays two hyphens
NSAutomaticPeriodSubstitutionEnabled = false  # two spaces are two spaces
NSAutomaticInlinePredictionEnabled = false

[bootstrap.macos.trackpad]
tap_to_click = true

# Screenshots, which the friendly sections above do not cover. `location` is what
# older macOS read and the two specific keys are what current versions read; all
# three are set on this machine, so all three are declared. macOS does not create
# the folder — without it a screenshot goes nowhere — hence the directory below.
[bootstrap.macos.defaults."com.apple.screencapture"]
location = "~/Downloads/Screenshots"
location-screenshot = "~/Downloads/Screenshots"
location-screenrecording = "~/Downloads/Screenshots"

[bootstrap.directories."~/Downloads/Screenshots"]
mode = "0755"

# `mise upgrade` walks [tools] and nothing else, and [bootstrap.packages] is a
# bootstrap-time description — so the brew half of the machine was never being
# updated by anything. `mise bootstrap packages upgrade` does not close the gap
# on its own: it declines every cask that carries a Homebrew receipt ("installed
# and managed by Homebrew; leaving unchanged"), which here is all of them. brew
# is the only thing that upgrades the brew side, so this task calls both.
[tasks.upgrade]
description = "update the mise tools and everything Homebrew installed"
run = [
  # --global: only the tools declared here, whatever project the task runs from.
  "mise upgrade --global",
  "brew update",
  # -y because a task must not stop for a prompt: this Homebrew asks before
  # touching casks that carry auto_updates, and 13 of the 14 here do. Plain
  # `brew upgrade` already covers those, so there is no separate --cask step and
  # no --greedy — the latter only adds casks pinned to :latest, at the price of
  # re-downloading apps that update themselves.
  "brew upgrade -y",
  # With aqua.baked_registry = false, mise compiles the fetched registry into a
  # cache that a newer mise may fail to decode even when the format directory
  # (v9) stays the same — after brew moved mise to 2026.9.16 every aqua tool
  # went missing. The sources stay, so the next lookup recompiles locally.
  "rm -rf \"$(mise cache path)/aqua-registry/compiled\"",
  # A cask ends up owned by whichever of the two installed it, and neither can
  # see the other's bookkeeping: mise writes .mise-cask.toml where brew wants
  # .metadata, so brew skips mise's casks and mise declines brew's ("installed
  # and managed by Homebrew"). Running both is what covers the whole set. This
  # is also why `brew doctor` reports invalid Caskroom metadata for anything
  # mise installed, and `mise bootstrap packages status` calls anything brew
  # reinstalled missing — the two never agree, and both apps are fine.
  "mise bootstrap packages upgrade --yes",
]

# Everything that can be thrown away and rebuilt on demand. Every step is
# best-effort: a failed prune is reported and the rest still runs. Docker is
# started by hand, so its prune also skips itself when the daemon is down.
[tasks."clean:docker"]
description = "prune docker"
skip_if = "! docker info >/dev/null 2>&1"
run = "docker system prune -af --volumes || echo 'docker prune failed, continuing'"

[tasks.clean]
description = "prune docker, brew, unused mise versions and the go, golangci-lint, uv, npm, pnpm and trivy caches"
depends = ["clean:docker"]
run = [
  "brew cleanup --prune=all -s || echo 'brew cleanup failed, continuing'",
  "mise prune --yes || echo 'mise prune failed, continuing'",
  # The go build cache is never trimmed by go itself and grows without bound
  # (62G here); the next build just refills what it needs. It can fail with
  # "directory not empty" when a build races the cleanup, which is harmless.
  "go clean -cache || echo 'go clean failed, continuing'",
  # Both caches are keyed by path, so every agent worktree that builds or lints
  # adds its own entries and nothing ever evicts them (9G and 10G here).
  "golangci-lint cache clean || echo 'golangci-lint cache clean failed, continuing'",
  "uv cache clean || echo 'uv cache clean failed, continuing'",
  "npm cache clean --force || echo 'npm cache clean failed, continuing'",
  "trivy clean --all || echo 'trivy clean failed, continuing'",
  # Docker Scout's SBOM cache, 7G here, and not covered by the docker prune.
  "rm -rf \"$HOME/.docker/scout\"",
  # Only packages no project references anymore. Projects get their files cloned
  # from the store (APFS copy-on-write), so du overstates every node_modules.
  "pnpm store prune || echo 'pnpm prune failed, continuing'",
]

# The repo describes the machine but not the accounts on it: ssh keys, logins and
# tokens are still done by hand. These turn that checklist into something
# runnable — `mise doctor project` reports what is still missing, while
# `mise bootstrap status` covers only the declarative parts. Checks just inspect
# state; mise never runs the hints.
[doctor.checks.gh]
description = "gh is authenticated — git credentials come from it, see .gitconfig"
run = "gh auth status"
hint = "Run `gh auth login`."
timeout = "10s"

[doctor.checks.glab]
description = "glab is authenticated"
run = "glab auth status"
hint = "Run `glab auth login`."
timeout = "10s"

[doctor.checks.ssh-agent]
description = "ssh keys are served by the 1Password agent"
run = 'grep -q IdentityAgent "$HOME/.ssh/config"'
hint = "Point IdentityAgent at the 1Password socket in ~/.ssh/config."

[doctor.checks.commit-signing]
description = "op-ssh-sign is in place — .gitconfig signs every commit with it"
run = '[ -x "/Applications/1Password.app/Contents/MacOS/op-ssh-sign" ]'
hint = "Launch 1Password once and turn on the SSH agent."

[doctor.checks.shell-secrets]
description = "~/.config/zsh/local.zsh holds the exports that cannot be tracked"
run = '[ -f "$HOME/.config/zsh/local.zsh" ]'
hint = "Put CODEX_GITHUB_PERSONAL_ACCESS_TOKEN and YANDEX_TRACKER_MCP_TOKEN there, out of 1Password."

[doctor.checks.npm-tokens]
description = "~/.npmrc carries the npmjs and npm.pkg.github.com tokens"
run = 'grep -q _authToken "$HOME/.npmrc"'
hint = "Copy the tokens out of 1Password into ~/.npmrc."
