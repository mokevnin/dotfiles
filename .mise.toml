# Project tasks for this repo. They live here and not in the global config because that
# file is also the global config, and a task there shows up in every project.
# Described once so the same thing runs locally and in CI, where the job just
# calls `mise run lint`.
[tasks.lint]
description = "jactionlint, nvim lint, taplo, typos, agnix, betterleaks"
run = [
  "jactionlint",
  "mise -C home/.config/nvim run lint",
  # lint, not fmt: taplo's formatter wants the trailing comments in this file on
  # its own column, and turning alignment off collapses them to a single space.
  # Neither is the layout here, and the check is for broken toml anyway — this
  # file is the machine, a syntax error in it is not a thing to push.
  "taplo lint home/.config/mise/config.toml",
  # taplo only knows toml, not mise: a misspelled key such as `experimantal`
  # parses fine and is silently ignored. explain flags it but exits 0 either
  # way, so the check is on its output.
  "! mise config explain --file home/.config/mise/config.toml | grep 'not a key mise reads'",
  "typos",
  # the skills in .agents/skills and their .claude/skills links; .agnix.toml
  # holds the target and the one vendored exception. Warnings do not fail it.
  "agnix .",
  # `git`, not `dir`: a secret that reached a commit and was removed afterwards
  # is still public, and this repo is. Needs fetch-depth: 0 in the workflow.
  # -c because the repo config is not auto-loaded; --redact keeps a real find
  # out of the public CI log.
  "betterleaks git . -c .betterleaks.toml --redact --no-banner",
]

[tasks.setup]
description = "install the git hooks from hk.pkl (pre-push runs lint)"
run = "hk install"
