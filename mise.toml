# Единственный конфиг машины. Симлинкуется в ~/.config/mise/config.toml,
# поэтому тулы и bootstrap-описание доступны глобально.
#
# Свежая машина:  mise bootstrap --from git@github.com:mokevnin/dotfiles.git --from-dir ~/dotfiles --yes
# Уже склонировано: mise bootstrap --yes

[settings]
idiomatic_version_file_enable_tools = []
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[settings.ruby]
compile = false

[tools]
# языки / рантаймы
go = "latest"
java = "temurin-25"
node = "26.8.1"
python = "latest"
ruby = "latest"

# cli
actionlint = "latest"
air = "latest"
ast-grep = "latest"
bat = "latest"
bottom = "latest"            # btm, вместо htop
delta = "latest"
fd = "latest"
fzf = "latest"
gdu = "latest"               # вместо ncdu
lazygit = "latest"
markdownlint-cli2 = "latest"
neovim = "latest"
overmind = "latest"
pandoc = "latest"
ripgrep = "latest"
sd = "latest"                # вместо gnu-sed
shellcheck = "latest"
tealdeer = "latest"          # даёт tldr
xh = "latest"                # вместо httpie
"ubi:atanunq/viu" = "latest"
"ubi:hpjansson/chafa" = "latest"

# хосты nvim-провайдеров, должны жить внутри активных node/ruby
"npm:neovim" = "latest"
"npm:markdown-toc" = "latest"
"gem:neovim" = "latest"

# Системные пакеты. mise ставит brew-формулы сам, Homebrew ставить не нужно.
[bootstrap.packages]
"brew:wget" = "latest"
"brew:sox" = "latest"
"brew-cask:font-ubuntu-nerd-font" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"
"apt:zsh" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:sox" = "latest"
"apt:zip" = "latest"
"apt:exuberant-ctags" = "latest"
"apt:build-essential" = "latest"
"apt:python3-pip" = "latest"

[bootstrap.repos]
"~/.oh-my-zsh/custom/plugins/you-should-use" = { url = "https://github.com/MichaelAquilina/zsh-you-should-use.git", ref = "master" }

[dotfiles]
"~/.config/nvim" = "nvim"
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.oh-my-zsh/custom/useful.zsh" = { content = "alias fixssh='eval $(tmux showenv -s SSH_AUTH_SOCK)'\n" }

[bootstrap.mise_shell_activate]
zshrc = "activate"

[bootstrap.user]
login_shell = "/bin/zsh"

# oh-my-zsh должен существовать до клонирования плагина в его custom/
[bootstrap.hooks.pre-repos]
run = '[ -d "$HOME/.oh-my-zsh" ] || RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"'

# oh-my-zsh умеет включать плагины сам, идемпотентно
[tasks.bootstrap]
description = "Включить плагины oh-my-zsh"
# `omz plugin enable` возвращает 1, если плагин уже включён — это не ошибка
run = "zsh -ic 'omz plugin enable git mise vi-mode fzf docker docker-compose you-should-use' || true"
