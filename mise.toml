# Единственный конфиг машины, только под macOS. Симлинкуется в
# ~/.config/mise/config.toml, поэтому тулы и bootstrap-описание доступны
# глобально.
#
# Свежая машина:  mise bootstrap --from https://github.com/mokevnin/dotfiles.git --from-dir ~/dotfiles --yes
# (по https — ssh-ключей на новой машине ещё нет; bootstrap запускать из ~/dotfiles)
# Уже склонировано: mise bootstrap --yes

[settings]
idiomatic_version_file_enable_tools = []
# 64 тула на "latest" — это десятки запросов к api.github.com, а анонимный
# лимит там 60 в час, отсюда 429 на upgrade. Токен берём у gh, в репо он не
# лежит; если gh ещё не авторизован (свежая машина), mise просто ругнётся
# в warning и пойдёт анонимно.
github.credential_command = "gh auth token"
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[settings.ruby]
compile = false

[tools]
# языки / рантаймы
go = "latest"
java = "temurin-25"
node = "26.8.1"
python = "latest"
ruby = "latest"

pnpm = "latest"

# cli
actionlint = "latest"
air = "latest"
ansible = "latest"
"pipx:ansible-lint" = "latest"
ast-grep = "latest"
atuin = "latest"             # история шелла с поиском и синком
bat = "latest"
bottom = "latest"            # btm, вместо htop
claude-code = "latest"
codex = "latest"
copilot-cli = "latest"
delta = "latest"
difftastic = "latest"        # структурный diff, понимает синтаксис
docker-cli = "latest"
docker-compose = "latest"
duf = "latest"               # вместо df
dust = "latest"              # вместо du
eza = "latest"               # вместо ls
fd = "latest"
fzf = "latest"
gdu = "latest"               # вместо ncdu
gh = "latest"
glab = "latest"
glow = "latest"              # markdown в терминале
hyperfine = "latest"         # бенчмарк команд
helm = "latest"
jq = "latest"
just = "latest"
k9s = "latest"
kubectl = "latest"
kubectx = "latest"
lazydocker = "latest"
lazygit = "latest"
markdownlint-cli2 = "latest"
neovim = "latest"
opencode = "latest"
overmind = "latest"
pandoc = "latest"
pipx = "latest"           # нужен для бэкенда pipx: (ansible, ansible-lint)
ripgrep = "latest"
sd = "latest"                # вместо gnu-sed
sentry-cli = "latest"
shellcheck = "latest"
stern = "latest"
stylua = "latest"            # форматтер lua, им же проверяется конфиг nvim в CI
tealdeer = "latest"          # даёт tldr
terraform = "latest"
tokei = "latest"             # статистика по коду
watchexec = "latest"         # запуск команды на изменение файлов
xh = "latest"                # вместо httpie
yazi = "latest"              # файловый менеджер, превью картинок через viu
yq = "latest"
zoxide = "latest"            # умный cd
"github:atanunq/viu" = "latest"
"github:joshmedeski/sesh" = "latest"   # менеджер tmux-сессий

# хосты nvim-провайдеров, должны жить внутри активных node/ruby
"npm:neovim" = "latest"
"npm:markdown-toc" = "latest"
"gem:neovim" = "latest"

# Homebrew mise поставить себе не может, а brew:/brew-cask: он ставит через сам
# brew — значит brew должен появиться раньше пакетов. NONINTERACTIVE=1 — чтобы
# установщик не ждал Enter при --yes; пароль для sudo он всё равно спросит.
[bootstrap.hooks.pre-packages]
run = 'command -v brew >/dev/null 2>&1 || [ -x /opt/homebrew/bin/brew ] || [ -x /usr/local/bin/brew ] || NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'

# Системные пакеты. brew:/brew-cask: ставит mise, но руками самого Homebrew.
[bootstrap.packages]
"brew:wget" = "latest"
"brew:sox" = "latest"
"brew:tmux" = "latest"       # нужен sesh и overmind, сами они его не тянут
"brew:git-lfs" = "latest"    # фильтр lfs прописан в gitconfig
"brew-cask:ghostty" = "latest"
"brew-cask:docker-desktop" = "latest"   # docker-cli без демона бесполезен
"brew-cask:1password" = "latest"        # op-ssh-sign подписывает коммиты
"brew-cask:google-chrome" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:github" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:telegram" = "latest"
"brew-cask:whatsapp" = "latest"
"brew-cask:chatgpt" = "latest"
"brew-cask:claude" = "latest"
"brew-cask:obs" = "latest"
"brew-cask:audacity" = "latest"
# каски-pkg: brew ставит их через installer(8), то есть спросит пароль
"brew-cask:zoom" = "latest"
"brew-cask:nordvpn" = "latest"
"brew-cask:font-ubuntu-nerd-font" = "latest"
"brew-cask:font-hack-nerd-font" = "latest"

[bootstrap.repos]
"~/.oh-my-zsh/custom/plugins/you-should-use" = { url = "https://github.com/MichaelAquilina/zsh-you-should-use.git", ref = "master" }

[dotfiles]
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/nvim" = "nvim"
"~/.gitconfig" = "gitconfig"
"~/.oh-my-zsh/custom/useful.zsh" = { content = "alias fixssh='eval $(tmux showenv -s SSH_AUTH_SOCK)'\n" }
# ~/.local/bin — туда mise.run кладёт бинарь, иначе блок mise activate ниже
# не найдёт сам mise. Шимы в хвосте: все строки отсюда попадают в .zshrc до
# блока активации, то есть atuin ниже без них в свежем шелле ещё не виден
# (активация всё равно ставит настоящие пути впереди шимов).
"~/.zshrc/mise-path" = { line = 'export PATH="$HOME/.local/bin:$PATH:$HOME/.local/share/mise/shims"' }
# у atuin нет плагина oh-my-zsh
"~/.zshrc/atuin" = { line = 'eval "$(atuin init zsh)"' }
# установщик Homebrew в неинтерактивном режиме сам .zshrc не правит,
# а brew-формулы (wget, sox) лежат в его префиксе
"~/.zshrc/brew" = { line = '[ -x /opt/homebrew/bin/brew ] && eval "$(/opt/homebrew/bin/brew shellenv)"' }
# yc ставится своим скриптом (см. хук post-tools), его каталог надо добавить в PATH
"~/.zshrc/yc" = { line = 'export PATH="$HOME/.local/yandex-cloud/bin:$PATH"' }

[bootstrap.mise_shell_activate]
zshrc = "activate"

[bootstrap.user]
login_shell = "/bin/zsh"

# oh-my-zsh должен существовать до клонирования плагина в его custom/
[bootstrap.hooks.pre-repos]
run = '[ -d "$HOME/.oh-my-zsh" ] || RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"'

# oh-my-zsh умеет включать плагины сам, идемпотентно
# Каск yandex-cloud-cli существует, но поставить его не выходит: brew выполняет
# стансу installer-script через sudo, а mise на этом каске теряет путь к бинарю
# (brew-cask: binary artifact 'yandex-cloud-cli/bin/yc' was not found).
# Поэтому — родной скрипт вендора, он работает без root.
[bootstrap.hooks.post-tools]
run = '[ -x "$HOME/.local/yandex-cloud/bin/yc" ] || curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/.local/yandex-cloud" -n'

[tasks.bootstrap]
description = "Включить плагины oh-my-zsh"
# `omz plugin enable` возвращает 1, если плагин уже включён — это не ошибка
run = "zsh -ic 'omz plugin enable git mise vi-mode fzf docker docker-compose you-should-use zoxide eza gh' || true"
